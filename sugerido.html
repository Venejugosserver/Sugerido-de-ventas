<template id="t-sug">
  <aside class="col-marcas tarj" aria-label="Marcas">
    <header><h2>Marcas</h2><p class="sub" id="lm-res"></p></header>
    <input type="search" class="campo" id="buscar-marca" placeholder="Buscar marca" aria-label="Buscar marca">
    <div class="seg" role="radiogroup" aria-label="Mostrar" id="s-lista">
      <button class="seg-op" role="radio" data-v="pedido">Con pedido</button>
      <button class="seg-op" role="radio" data-v="alertas">Con quiebres</button>
      <button class="seg-op" role="radio" data-v="todas">Todas</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Ordenar marcas" id="s-orden-m">
      <button class="seg-op" role="radio" data-v="monto">Por monto</button>
      <button class="seg-op" role="radio" data-v="az">A a Z</button>
    </div>
    <ul class="lista-marcas" id="lista-marcas"></ul>
  </aside>

  <section class="col-centro">
    <div id="aviso-local"></div>
    <div class="tarj cab-marca" id="cab">
      <div class="cab-top">
        <div><h2 id="c-nombre"></h2><p class="sub" id="c-sub"></p></div>
        <div class="presup">
          <div class="fila"><label for="presupuesto" class="nota">Presupuesto de compra</label><input class="campo" id="presupuesto" type="number" min="0" step="100" inputmode="decimal" placeholder="Sin límite"></div>
          <div class="medidor" id="medidor"><i></i></div>
          <div class="nota" id="presup-txt"></div>
        </div>
      </div>
      <div class="metricas" id="c-metricas"></div>
      <div class="params">
        <span>Cobertura objetivo</span><input class="campo" id="p-cob" type="number" min="1" max="120" step="1" aria-label="Cobertura objetivo en días"><span>días</span>
        <span>+ stock de seguridad</span><input class="campo" id="p-seg" type="number" min="0" max="60" step="1" aria-label="Stock de seguridad en días"><span>días</span>
        <span class="nota" id="p-txt"></span>
      </div>
    </div>

    <div class="tarj">
      <div class="herr-tabla">
        <input type="search" class="campo" id="buscar-prod" placeholder="Buscar producto o código" aria-label="Buscar producto">
        <select class="campo" id="f-submarca" aria-label="Submarca"><option value="">Todas las submarcas</option></select>
        <select class="campo" id="f-unidad" aria-label="Unidad de medida"><option value="">Todas las unidades</option></select>
        <span class="filtro-activo chip" id="f-estado" hidden></span>
        <label class="chk"><input type="checkbox" id="f-inactivos"> Sin movimiento</label>
        <button class="btn chico fant" id="restablecer" title="Vuelve todas las cantidades al sugerido del algoritmo">Restablecer</button>
      </div>
      <div class="tabla-env">
        <table class="t wb" id="tabla">
          <thead><tr>
            <th class="ord" data-k="cod">Código</th>
            <th class="ord" data-k="desc">Descripción</th>
            <th class="ord" data-k="unidad" title="Unidad en la que se expresan las cantidades de la fila">Unidad de medida</th>
            <th class="ord n" data-k="promMes" title="Venta mensual estimada (regularizada) en la unidad de medida">Prom. venta mes</th>
            <th class="ord n" data-k="ultimoMes" title="Lo que realmente se vendió en los últimos 30 días, en la unidad de medida">Venta últ. 30 días</th>
            <th class="ord n" data-k="stock">Stock actual</th>
            <th class="ord n" data-k="cobertura" title="Días hábiles que cubre el stock actual">Cobertura</th>
            <th class="ord n" data-k="algoritmo">Sugerido algoritmo</th>
            <th class="n">Sugerido ajustado</th>
            <th class="ord n" data-k="var">Variación</th>
            <th class="ord n" data-k="costo" title="Costo del inventario por unidad de compra">Costo U.</th>
            <th class="ord n" data-k="subtotal">Subtotal</th>
            <th>Ajuste rápido</th>
          </tr></thead>
          <tbody id="cuerpo"></tbody>
          <tfoot id="pie-tabla"></tfoot>
        </table>
      </div>
      <p class="nota" id="nota-tabla" style="margin:10px 0 0"></p>
      <div class="barra-pedido">
        <div class="resumen" id="resumen-pedido"></div>
        <button class="btn" id="guardar">Guardar borrador</button>
        <button class="btn rojo" id="aprobar">Aprobar y enviar pedido</button>
      </div>
    </div>
  </section>

  <aside class="col-ctx">
    <div class="tarj ancho">
      <header><div><h2>Tendencia de compra</h2><p class="sub">Venta de la marca a clientes, últimos 6 meses</p></div>
        <div class="seg" role="radiogroup" aria-label="Medida" id="s-tend"><button class="seg-op" role="radio" data-v="v">$</button><button class="seg-op" role="radio" data-v="q">Unid.</button></div></header>
      <div class="lienzo bajo"><canvas id="g-tend" role="img" aria-label="Tendencia de compra de la marca"></canvas></div>
    </div>
    <div class="tarj">
      <header><h2>Alertas de negocio</h2></header>
      <ul class="alertas" id="alertas"></ul>
    </div>
    <div class="tarj">
      <header><h2>Notas del evaluador</h2></header>
      <textarea class="campo" id="notas" placeholder="Condiciones con el proveedor, promociones, fechas de entrega…"></textarea>
      <p class="nota" id="estado-borrador" style="margin:8px 0 0"></p>
    </div>
    <div class="tarj">
      <header><h2>Pedidos aprobados</h2></header>
      <ul class="hist" id="historial"></ul>
    </div>
  </aside>
</template>

<dialog id="dlg-calc" aria-labelledby="dc-tit">
  <div class="dlg">
    <div><h2 id="dc-tit"></h2><p class="nota" id="dc-cod" style="margin:2px 0 0"></p></div>
    <div class="dc-res" id="dc-res"></div>
    <div class="tabla-env"><table class="t" id="dc-meses"></table></div>
    <p class="nota" id="dc-rangos" style="margin:0;line-height:1.55"></p>
    <p class="nota" id="dc-equiv" style="margin:0;line-height:1.55" hidden></p>
    <p class="nota" id="dc-nota" style="margin:0"></p>
    <div class="pie-dlg"><button class="btn prim" id="dc-cerrar">Cerrar</button></div>
  </div>
