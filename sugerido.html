<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugerido por marca · SUGERIDO DE VENTAS · Venejugos 2015</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="estilos.css">
<style>
  main.sug{max-width:1760px;display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:16px;align-items:start}
  .col-marcas{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px;padding:16px}
  .col-marcas > *{flex:0 0 auto}
  .col-marcas .seg{display:grid;grid-auto-columns:1fr;width:100%}
  .col-marcas .seg-op{padding:6px 4px;font-size:.78rem}
  .col-ctx{display:grid;gap:16px;position:sticky;top:12px}
  .col-centro{display:grid;gap:16px;min-width:0}
  @media (max-width:1760px){main.sug{grid-template-columns:260px minmax(0,1fr)}.col-ctx{grid-column:2;position:static;grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1380px){.col-ctx{grid-template-columns:repeat(2,minmax(0,1fr))}.col-ctx .ancho{grid-column:1/-1}}
  @media (max-width:1100px){main.sug{grid-template-columns:minmax(0,1fr)}.col-marcas{position:static;max-height:none}.col-ctx{grid-column:auto;grid-template-columns:minmax(0,1fr)}.lista-marcas{max-height:260px}}
  .barra-pedido{position:sticky;bottom:0;z-index:5;margin:12px -20px -18px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sup) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--linea-2);border-radius:0 0 14px 14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
  .barra-pedido .resumen{flex:1 1 260px;font-size:.84rem;color:var(--tinta-2)}
  .barra-pedido .resumen b{font-size:1.08rem;color:var(--tinta);font-stretch:110%}
  .barra-pedido .btn{padding:10px 16px}
  @media (max-width:640px){.barra-pedido .btn{flex:1}}
  .col-marcas > .lista-marcas{list-style:none;margin:0 -6px;padding:0;overflow:auto;flex:1 1 auto;min-height:120px}
  .lista-marcas button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer}
  .lista-marcas button:focus-visible{outline:2px solid var(--azul-2)}
  .lista-marcas button[aria-current="true"]{background:var(--azul);color:#fff}
  .lista-marcas button[aria-current="true"] .lm-sub{color:rgba(255,255,255,.75)}
  .lista-marcas button[aria-current="true"] .chip{background:rgba(255,255,255,.18);color:#fff}
  @media (hover:hover) and (pointer:fine){.lista-marcas button:not([aria-current="true"]):hover{background:var(--azul-suave)}}
  .lm-nom{font-weight:700;font-size:.86rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lm-monto{font-weight:760;font-size:.86rem;font-stretch:110%;text-align:right}
  .lm-sub{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--tinta-3)}
  .cab-marca{display:grid;gap:14px}
  .cab-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .cab-top h2{margin:0;font-size:1.6rem;font-weight:800;font-stretch:118%;line-height:1.05;letter-spacing:-.005em}
  .cab-top .sub{margin-top:4px}
  .metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px dashed var(--linea-2)}
  .metricas > div{padding:10px 12px 2px;border-right:1px dashed var(--linea-2)}
  .metricas > div:last-child{border-right:0}
  .metricas .et{font-size:.74rem;color:var(--tinta-3);font-weight:600;font-stretch:88%}
  .metricas .v{font-size:1.12rem;font-weight:760;font-stretch:110%;white-space:nowrap}
  .presup{display:grid;gap:6px;min-width:250px}
  .presup .fila{display:flex;gap:8px;align-items:center}
  .presup input{width:130px;text-align:right}
  .medidor{height:8px;border-radius:999px;background:var(--linea);overflow:hidden}
  .medidor i{display:block;height:100%;background:var(--azul-2);width:0;transition:width 200ms var(--ease-out)}
  .medidor.pasa i{background:#E61C24}
  .params{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--tinta-2)}
  .params input{width:64px;text-align:right;padding:5px 8px}
  .herr-tabla{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .herr-tabla input[type="search"]{flex:1 1 220px}
  table.wb td{padding:6px 7px}
  table.wb .aj{width:78px;text-align:right;padding:5px 7px;font-weight:700}
  table.wb .aj.cambiado{background:var(--azul-suave);box-shadow:0 0 0 1px var(--azul-2) inset}
  .rap{display:flex;gap:3px}
  .rap button{border:0;border-radius:6px;padding:3px 6px;font-size:.7rem;font-weight:700;background:var(--azul-suave);color:var(--azul-2);cursor:pointer;font-stretch:90%}
  .rap button:active{transform:scale(.95)}
  .cob{font-weight:700}
  .cob.quiebre{color:var(--rojo)}.cob.riesgo{color:var(--ambar)}.cob.exceso{color:var(--azul-2)}
  .var-pos{color:var(--verde)}.var-neg{color:var(--rojo)}
  .alertas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .alertas li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:var(--sup-2);box-shadow:var(--anillo);cursor:pointer;font-size:.82rem;line-height:1.35}
  .alertas li button:focus-visible{outline:2px solid var(--azul-2)}
  .alertas li.rojo button{background:var(--rojo-suave);box-shadow:none}
  .alertas li.ambar button{background:var(--ambar-suave);box-shadow:none}
  .alertas b{display:block;font-size:.84rem}
  .alertas .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:.78rem;color:#fff;background:var(--azul-2)}
  .alertas li.rojo .ic{background:var(--rojo)}.alertas li.ambar .ic{background:var(--ambar)}
  .acciones-fin{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:12px}
  .acciones-fin .btn{padding:11px 14px}
  .hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.8rem}
  .hist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--sup-2)}
  .filtro-activo{display:inline-flex;gap:6px;align-items:center}
  .filtro-activo button{border:0;background:none;cursor:pointer;color:inherit;font-weight:800;padding:0 2px}
  .sel-movil{display:none}
  @media (max-width:1020px){.sel-movil{display:block}}
</style>
<script src="chart.umd.min.js"></script>
<script src="nucleo.js"></script>
<script src="ui.js"></script>
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <img class="logo" src="logo.jpg" alt="Venejugos">
    <div class="titulo"><h1>SUGERIDO DE VENTAS</h1><p id="sub">Sugerido por marca · Venejugos 2015</p></div>
    <nav class="nav seg" aria-label="Secciones">
      <a class="seg-op" href="index.html">Analítico</a>
      <a class="seg-op" href="sugerido.html" aria-current="page">Sugerido</a>
      <a class="seg-op" href="admin.html">Panel administrativo</a>
    </nav>
  </div>
</header>

<main id="app">
  <div class="cargando"><div>Calculando el sugerido…</div><div class="barra-prog"><i style="width:45%"></i></div></div>
</main>
<p class="pie" id="pie"></p>

<template id="t-sug">
  <aside class="col-marcas tarj" aria-label="Marcas">
    <header><h2>Marcas</h2><p class="sub" id="lm-res"></p></header>
    <input type="search" class="campo" id="buscar-marca" placeholder="Buscar marca" aria-label="Buscar marca">
    <div class="seg" role="radiogroup" aria-label="Mostrar" id="s-lista">
      <button class="seg-op" role="radio" data-v="pedido">Con pedido</button>
      <button class="seg-op" role="radio" data-v="alertas">Con quiebres</button>
      <button class="seg-op" role="radio" data-v="todas">Todas</button>
    </div>
    <ul class="lista-marcas" id="lista-marcas"></ul>
  </aside>

  <section class="col-centro">
    <div id="aviso-local"></div>
    <div class="tarj cab-marca" id="cab">
      <div class="cab-top">
        <div><h2 id="c-nombre"></h2><p class="sub" id="c-sub"></p></div>
        <div class="presup">
          <div class="fila"><label for="presupuesto" class="nota">Presupuesto de compra</label><input class="campo" id="presupuesto" type="number" min="0" step="100" inputmode="decimal" placeholder="Sin límite"></div>
          <div class="medidor" id="medidor"><i></i></div>
          <div class="nota" id="presup-txt"></div>
        </div>
      </div>
      <div class="metricas" id="c-metricas"></div>
      <div class="params">
        <span>Cobertura objetivo</span><input class="campo" id="p-cob" type="number" min="1" max="120" step="1" aria-label="Cobertura objetivo en días"><span>días</span>
        <span>+ stock de seguridad</span><input class="campo" id="p-seg" type="number" min="0" max="60" step="1" aria-label="Stock de seguridad en días"><span>días</span>
        <span class="nota" id="p-txt"></span>
      </div>
    </div>

    <div class="tarj">
      <div class="herr-tabla">
        <input type="search" class="campo" id="buscar-prod" placeholder="Buscar producto o código" aria-label="Buscar producto">
        <select class="campo" id="f-submarca" aria-label="Submarca"><option value="">Todas las submarcas</option></select>
        <span class="filtro-activo chip" id="f-estado" hidden></span>
        <label class="chk"><input type="checkbox" id="f-inactivos"> Sin movimiento</label>
        <button class="btn chico fant" id="restablecer" title="Vuelve todas las cantidades al sugerido del algoritmo">Restablecer</button>
      </div>
      <div class="tabla-env">
        <table class="t wb" id="tabla">
          <thead><tr>
            <th class="ord" data-k="cod">Código</th>
            <th class="ord" data-k="desc">Descripción</th>
            <th class="ord n" data-k="promMes" title="Promedio de venta mensual en la unidad de compra">Prom. venta mes</th>
            <th class="ord n" data-k="stock">Stock actual</th>
            <th class="ord n" data-k="cobertura" title="Días hábiles que cubre el stock actual">Cobertura</th>
            <th class="ord n" data-k="algoritmo">Sugerido algoritmo</th>
            <th class="n">Sugerido ajustado</th>
            <th class="ord n" data-k="var">Variación</th>
            <th class="ord n" data-k="costo" title="Costo del inventario por unidad de compra">Costo U.</th>
            <th class="ord n" data-k="subtotal">Subtotal</th>
            <th>Ajuste rápido</th>
          </tr></thead>
          <tbody id="cuerpo"></tbody>
          <tfoot id="pie-tabla"></tfoot>
        </table>
      </div>
      <p class="nota" id="nota-tabla" style="margin:10px 0 0"></p>
      <div class="barra-pedido">
        <div class="resumen" id="resumen-pedido"></div>
        <button class="btn" id="guardar">Guardar borrador</button>
        <button class="btn rojo" id="aprobar">Aprobar y enviar pedido</button>
      </div>
    </div>
  </section>

  <aside class="col-ctx">
    <div class="tarj ancho">
      <header><div><h2>Tendencia de compra</h2><p class="sub">Venta de la marca a clientes, últimos 6 meses</p></div>
        <div class="seg" role="radiogroup" aria-label="Medida" id="s-tend"><button class="seg-op" role="radio" data-v="v">$</button><button class="seg-op" role="radio" data-v="q">Unid.</button></div></header>
      <div class="lienzo bajo"><canvas id="g-tend" role="img" aria-label="Tendencia de compra de la marca"></canvas></div>
    </div>
    <div class="tarj">
      <header><h2>Alertas de negocio</h2></header>
      <ul class="alertas" id="alertas"></ul>
    </div>
    <div class="tarj">
      <header><h2>Notas del evaluador</h2></header>
      <textarea class="campo" id="notas" placeholder="Condiciones con el proveedor, promociones, fechas de entrega…"></textarea>
      <p class="nota" id="estado-borrador" style="margin:8px 0 0"></p>
    </div>
    <div class="tarj">
      <header><h2>Pedidos aprobados</h2></header>
      <ul class="hist" id="historial"></ul>
    </div>
  </aside>
</template>

<script>
(() => {
  'use strict';
  const N = NUC, { $, $$ } = UI;
  let M = null, S = null, local = false;
  const E = { marca: null, lista: 'pedido', buscar: '', buscarProd: '', submarca: '', inactivos: false, estado: null, orden: { k: 'subtotal', dir: -1 }, tend: 'v' };
  const B = {};            // borrador de la marca actual
  const kB = un => 'vjs_borrador:' + un;
  const PED = 'vjs_pedidos';

  /* ---------- Borradores ---------- */
  function cargarBorrador(un) {
    const b = UI.leerLS(kB(un), null) || {};
    Object.keys(B).forEach(k => delete B[k]);
    Object.assign(B, { ajustes: {}, notas: '', presupuesto: null, cobertura: null, seguridad: null, guardado: null }, b);
  }
  function guardarBorrador(silencioso) {
    B.guardado = new Date().toISOString();
    UI.guardarLS(kB(E.marca), B);
    $('#estado-borrador').textContent = `Borrador guardado ${new Date(B.guardado).toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' })}`;
    if (!silencioso) UI.aviso('Borrador guardado', `${E.marca}: ${lineasPedido().length} productos con cantidad.`);
  }

  /* ---------- Cálculo ---------- */
  function aplicarParametrosLocales() {
    const marcas = M.C.marcas = JSON.parse(JSON.stringify(M.Cbase || {}));
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('vjs_borrador:')) continue;
      const un = k.slice(13), b = UI.leerLS(k, {});
      if (!b) continue;
      const base = (M.Cbase && M.Cbase[un]) || {};
      marcas[un] = { ...base };
      if (b.cobertura != null) marcas[un].cobertura = b.cobertura;
      if (b.seguridad != null) marcas[un].seguridad = b.seguridad;
    }
  }
  function recalcular() { aplicarParametrosLocales(); S = N.calcularSugerido(M); }
  const marcaActual = () => S.marcas.find(m => m.un === E.marca);
  const ajustado = r => (B.ajustes[r.id] != null ? B.ajustes[r.id] : r.algoritmo);
  function lineasPedido() { const m = marcaActual(); return m ? m.filas.filter(r => ajustado(r) > 0) : []; }
  function totales() {
    const m = marcaActual();
    let total = 0, totalAlg = 0, uds = 0, n = 0, consumo = 0, stockFin = 0;
    for (const r of m.filas) {
      const a = ajustado(r);
      total += a * r.costo; totalAlg += r.algoritmo * r.costo; uds += a;
      if (a > 0) n++;
      if (r.vpd > 0 && r.estado !== 'inactivo') { consumo += r.vpd / r.fc * r.costo; stockFin += (r.stock + a) * r.costo; }
    }
    return { total, totalAlg, uds, n, cobFinal: consumo > 0 ? stockFin / consumo : null };
  }

  /* ---------- Lista de marcas ---------- */
  function pintarLista() {
    const q = N.norm(E.buscar);
    let ms = S.marcas.slice();
    if (E.lista === 'pedido') ms = ms.filter(m => m.tot.sugeridoValor > 0 || (UI.leerLS(kB(m.un)) || {}).guardado);
    if (E.lista === 'alertas') ms = ms.filter(m => m.tot.quiebres + m.tot.riesgo > 0);
    if (q) ms = ms.filter(m => N.norm(m.un).includes(q));
    $('#lm-res').textContent = `${S.marcas.filter(m => m.tot.sugeridoValor > 0).length} de ${S.marcas.length} con pedido sugerido`;
    $('#lista-marcas').innerHTML = ms.map(m => {
      const b = UI.leerLS(kB(m.un)) || {};
      const chips = [m.tot.quiebres ? `<span class="chip rojo">${m.tot.quiebres} quiebre${m.tot.quiebres > 1 ? 's' : ''}</span>` : '', m.tot.riesgo ? `<span class="chip ambar">${m.tot.riesgo} en riesgo</span>` : '', b.guardado ? '<span class="chip">Borrador</span>' : ''].join('');
      return `<li><button data-un="${N.esc(m.un)}" aria-current="${m.un === E.marca}"><span class="lm-nom">${N.esc(m.un)}</span><span class="lm-monto">${N.fmtCorto(m.tot.sugeridoValor)}</span><span class="lm-sub">${m.tot.skus} productos${m.tot.cobertura != null ? ` · ${N.fmtN(m.tot.cobertura, 0)} días` : ''}${chips}</span></button></li>`;
    }).join('') || '<li class="vacio">Ninguna marca coincide.</li>';
    $$('#lista-marcas button').forEach(b => b.addEventListener('click', () => elegir(b.dataset.un)));
  }

  function elegir(un) {
    E.marca = un; E.estado = null; E.submarca = ''; E.buscarProd = '';
    cargarBorrador(un);
    history.replaceState(null, '', '?marca=' + encodeURIComponent(un));
    $$('#lista-marcas button').forEach(b => b.setAttribute('aria-current', String(b.dataset.un === un)));
    $('#buscar-prod').value = '';
    pintarMarca();
  }

  /* ---------- Cabecera de la marca ---------- */
  function pintarCabecera() {
    const m = marcaActual();
    const P = m.P;
    $('#c-nombre').textContent = m.un;
    const mods = new Set(m.filas.flatMap(r => r.mods.split('')));
    $('#c-sub').textContent = `Unidad de negocio · ${m.tot.skus} productos activos${m.tot.inactivos ? ` · ${m.tot.inactivos} sin movimiento ni inventario` : ''} · vende por ${[...mods].map(x => x === 'M' ? 'MobilVendor' : 'Módulo B').join(' y ')}`;
    const v30 = m.tot.venta30;
    $('#c-metricas').innerHTML = [
      ['Venta últimos 30 días', N.fmtUSD(v30, 0)],
      ['Inventario valorizado', N.fmtUSD(m.tot.stockValor, 0)],
      ['Cobertura actual', m.tot.cobertura != null ? `${N.fmtN(m.tot.cobertura, 1)} días` : '—'],
      ['Sugerido del algoritmo', N.fmtUSD(m.tot.sugeridoValor, 0)],
      ['Quiebres · en riesgo', `${m.tot.quiebres} · ${m.tot.riesgo}`]
    ].map(([a, b]) => `<div><div class="et">${a}</div><div class="v">${b}</div></div>`).join('');
    $('#p-cob').value = B.cobertura != null ? B.cobertura : P.cobertura;
    $('#p-seg').value = B.seguridad != null ? B.seguridad : P.seguridad;
    $('#p-txt').textContent = `Promedio ponderado: ${Math.round(P.pesoReciente * 100)} % últimos ${P.reciente} días y ${100 - Math.round(P.pesoReciente * 100)} % últimos ${P.ventana} días`;
    const pres = B.presupuesto != null ? B.presupuesto : (P.presupuesto || null);
    $('#presupuesto').value = pres || '';
    $('#notas').value = B.notas || '';
    $('#estado-borrador').textContent = B.guardado ? `Borrador guardado ${new Date(B.guardado).toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' })}` : 'Sin borrador guardado';
    const sms = [...new Set(m.filas.map(r => r.ma).filter(Boolean))].sort();
    $('#f-submarca').innerHTML = '<option value="">Todas las submarcas</option>' + sms.map(s => `<option>${N.esc(s)}</option>`).join('');
    $('#f-submarca').hidden = sms.length < 2;
  }
  function pintarPresupuesto() {
    const t = totales();
    const pres = +$('#presupuesto').value || 0;
    const med = $('#medidor');
    if (pres > 0) {
      med.querySelector('i').style.width = Math.min(100, t.total / pres * 100) + '%';
      med.classList.toggle('pasa', t.total > pres);
      $('#presup-txt').textContent = t.total > pres ? `Pedido ${N.fmtUSD(t.total, 0)} · supera por ${N.fmtUSD(t.total - pres, 0)}` : `Pedido ${N.fmtUSD(t.total, 0)} · disponible ${N.fmtUSD(pres - t.total, 0)}`;
    } else {
      med.querySelector('i').style.width = '0%'; med.classList.remove('pasa');
      $('#presup-txt').textContent = `Pedido ${N.fmtUSD(t.total, 0)} · sin presupuesto definido`;
    }
  }

  /* ---------- Tabla ---------- */
  function filasVisibles() {
    const m = marcaActual();
    const q = N.norm(E.buscarProd);
    let fs = m.filas.filter(r => E.inactivos || (r.estado !== 'inactivo' && !(r.estado === 'sinmov' && ajustado(r) === 0)));
    if (E.submarca) fs = fs.filter(r => r.ma === E.submarca);
    if (q) fs = fs.filter(r => N.norm(r.desc).includes(q) || r.codigos.some(c => c.includes(q)));
    if (E.estado) fs = fs.filter(E.estado.fn);
    const k = E.orden.k, d = E.orden.dir;
    const val = r => k === 'cod' ? r.codigos[0] : k === 'desc' ? r.desc : k === 'subtotal' ? ajustado(r) * r.costo : k === 'var' ? (r.algoritmo ? ajustado(r) / r.algoritmo : ajustado(r) ? 9 : 0) : k === 'cobertura' ? (isFinite(r.cobertura) ? r.cobertura : 1e9) : r[k];
    fs.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * d || b.venta30 - a.venta30; });
    return fs;
  }

    </tr>`;
  }
  const estadoTxt = e => ({ quiebre: 'Quiebre: sin stock con venta activa', riesgo: 'Riesgo de quiebre: cubre menos que el stock de seguridad', ok: 'Cobertura sana', exceso: 'Inventario excesivo', sinmov: 'Con stock y sin venta en la ventana', inactivo: 'Sin venta reciente ni inventario' }[e] || e);

  function pintarTabla() {

  let tAuto;

        plugins: { legend: { display: false }, tooltip: { callbacks: { label: it => ' ' + (q ? N.fmtN(it.raw) + ' unidades' : N.fmtUSD(it.raw, 0)), afterLabel: it => it.dataIndex === t.etiquetas.length - 1 ? 'Mes en curso' : '' } } } }
    });

  function pintarAlertas() {
    const m = marcaActual();
    const al = [];
    const nombre = r => `${r.codigos[0].slice(2)} ${r.desc}`;
    const por = e => m.filas.filter(r => r.estado === e).sort((a, b) => b.vpd / b.fc * b.costo - a.vpd / a.fc * a.costo);
    const t = totales();
    const pres = +$('#presupuesto').value || 0;
    if (pres > 0 && t.total > pres) al.push({ c: 'rojo', ic: '$', t: `Supera el presupuesto por ${N.fmtUSD(t.total - pres, 0)}`, d: `Pedido de ${N.fmtUSD(t.total, 0)} contra ${N.fmtUSD(pres, 0)} disponibles.`, f: null });
    const q = por('quiebre');
    if (q.length) al.push({ c: 'rojo', ic: '!', t: q.length === 1 ? `Quiebre en ${nombre(q[0])}` : `Quiebre en ${q.length} productos`, d: q.slice(0, 3).map(r => r.desc).join(' · ') + (q.length > 3 ? '…' : '') + ' — sin stock con venta activa.', f: { txt: 'Quiebre', fn: r => r.estado === 'quiebre' } });
    const rg = por('riesgo');
    if (rg.length) al.push({ c: 'ambar', ic: '!', t: rg.length === 1 ? `Riesgo de quiebre en ${nombre(rg[0])}` : `Riesgo de quiebre en ${rg.length} productos`, d: rg.slice(0, 3).map(r => `${r.desc} (${N.fmtN(r.cobertura, 1)} días)`).join(' · ') + (rg.length > 3 ? '…' : ''), f: { txt: 'Riesgo', fn: r => r.estado === 'riesgo' } });

    if (sobre.length) al.push({ c: 'ambar', ic: '↑', t: `Ajuste 30 % o más sobre el algoritmo en ${sobre.length} producto${sobre.length > 1 ? 's' : ''}`, d: sobre.slice(0, 3).map(r => r.desc).join(' · '), f: { txt: 'Ajuste alto', fn: r => r.algoritmo > 0 && ajustado(r) >= r.algoritmo * 1.3 } });
    const sinVenta = m.filas.filter(r => ajustado(r) > 0 && r.vpd <= 0);
    if (sinVenta.length) al.push({ c: 'ambar', ic: '?', t: `Pedido en ${sinVenta.length} producto${sinVenta.length > 1 ? 's' : ''} sin venta reciente`, d: sinVenta.slice(0, 3).map(r => r.desc).join(' · '), f: { txt: 'Sin venta', fn: r => ajustado(r) > 0 && r.vpd <= 0 } });
    const ex = por('exceso');
    if (ex.length) al.push({ c: '', ic: '≡', t: `Inventario excesivo en ${ex.length} producto${ex.length > 1 ? 's' : ''}`, d: `Cubren más de ${m.P.exceso} días: ${ex.slice(0, 3).map(r => r.desc).join(' · ')}${ex.length > 3 ? '…' : ''}`, f: { txt: 'Exceso', fn: r => r.estado === 'exceso' } });
    const sm = por('sinmov');
    if (sm.length) al.push({ c: '', ic: '–', t: `${sm.length} producto${sm.length > 1 ? 's' : ''} con stock y sin venta en ${m.P.ventana} días`, d: sm.slice(0, 3).map(r => r.desc).join(' · '), f: { txt: 'Sin movimiento', fn: r => r.estado === 'sinmov', inactivos: true } });
    const si = m.filas.filter(r => !r.conInv && r.estado !== 'inactivo');
    if (si.length) al.push({ c: '', ic: 'i', t: `${si.length} producto${si.length > 1 ? 's' : ''} con venta y sin registro en el inventario`, d: 'Se tratan como stock cero. Revisa el código en el agrupador si existe en el inventario.', f: { txt: 'Sin inventario', fn: r => !r.conInv } });
    const ce = m.filas.filter(r => r.costoEstimado && r.estado !== 'inactivo');
    if (ce.length) al.push({ c: '', ic: 'i', t: `${ce.length} costo${ce.length > 1 ? 's' : ''} estimado${ce.length > 1 ? 's' : ''}`, d: 'El costo del inventario no coincide con el precio o falta; se usó el margen típico.', f: { txt: 'Costo estimado', fn: r => r.costoEstimado } });
    if (!al.length) al.push({ c: '', ic: '✓', t: 'Sin alertas', d: 'La marca tiene cobertura sana con los parámetros actuales.', f: null });
    $('#alertas').innerHTML = al.map((a, i) => `<li class="${a.c}"><button data-i="${i}" ${a.f ? '' : 'disabled'}><span class="ic">${a.ic}</span><span><b>${N.esc(a.t)}</b>${N.esc(a.d)}</span></button></li>`).join('');

      const a = al[+b.dataset.i];

      $('#f-estado button').addEventListener('click', () => { E.estado = null; $('#f-estado').hidden = true; pintarTabla(); });
      pintarTabla();
      $('#tabla').scrollIntoView({ behavior: UI.reducido() ? 'auto' : 'smooth', block: 'start' });
    }));
  }

  /* ---------- Pedidos ---------- */
  function pintarHistorial() {
    const ps = (UI.leerLS(PED, []) || []).filter(p => p.un === E.marca).slice(0, 6);
    $('#historial').innerHTML = ps.map(p => `<li><span><b>${new Date(p.fecha).toLocaleDateString('es-VE', { day: 'numeric', month: 'short' })}</b> · ${p.lineas.length} productos · ${N.fmtUSD(p.total, 0)}${p.enviado ? ' · enviado' : ''}</span><button class="btn chico" data-id="${N.esc(p.id)}">Excel</button></li>`).join('') || '<li class="nota">Todavía no hay pedidos aprobados para esta marca.</li>';
    $$('#historial button').forEach(b => b.addEventListener('click', () => exportar((UI.leerLS(PED, []) || []).find(p => p.id === b.dataset.id))));
  }
  function cargarSheetJS() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'xlsx.full.min.js'; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar la librería de Excel.')); document.head.appendChild(s); });
  }
  async function exportar(p) {
    if (!p) return;
    try {
      await cargarSheetJS();
      const filas = [
        ['PEDIDO SUGERIDO · VENEJUGOS 2015'], ['Marca', p.un], ['Pedido', p.id], ['Aprobado', new Date(p.fecha).toLocaleString('es-VE')],
        ['Cobertura objetivo', `${p.parametros.cobertura} días + ${p.parametros.seguridad} de seguridad`], ['Notas', p.notas || ''], [],
        ['Código', 'Códigos agrupados', 'Descripción', 'Unidad de compra', 'Sugerido algoritmo', 'Cantidad pedida', 'Costo unitario', 'Subtotal', 'Stock actual', 'Cobertura actual (días)']
      ];
      for (const l of p.lineas) filas.push([l.codigo, l.codigos.join(', '), l.desc, l.uc, l.algoritmo, l.cantidad, +l.costo.toFixed(4), +l.subtotal.toFixed(2), +l.stock.toFixed(2), l.cobertura == null ? '' : +l.cobertura.toFixed(1)]);
      filas.push([], ['', '', 'TOTAL', '', p.lineas.reduce((a, l) => a + l.algoritmo, 0), p.lineas.reduce((a, l) => a + l.cantidad, 0), '', +p.total.toFixed(2)]);
      const ws = XLSX.utils.aoa_to_sheet(filas);
      ws['!cols'] = [{ wch: 14 }, { wch: 22 }, { wch: 46 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Pedido');
      XLSX.writeFile(wb, `Pedido_${p.un.replace(/[^A-Z0-9]+/gi, '_')}_${p.fecha.slice(0, 10)}.xlsx`);
    } catch (e) { UI.aviso('No se pudo crear el Excel', e.message, 'error'); }
  }
  async function aprobar() {
    const m = marcaActual();
    const ls = lineasPedido();
    if (!ls.length) { UI.aviso('El pedido está vacío', 'Ajusta al menos un producto con cantidad mayor que cero.', 'error'); return; }
    const t = totales();
    const ahora = new Date();
    const P = m.P;
    const p = {
      id: `P-${ahora.toISOString().slice(0, 16).replace(/[-:T]/g, '')}-${m.un.replace(/[^A-Z0-9]+/gi, '').slice(0, 10)}`,
      un: m.un, fecha: ahora.toISOString(), notas: $('#notas').value.trim(),
      parametros: { cobertura: +$('#p-cob').value || P.cobertura, seguridad: +$('#p-seg').value || P.seguridad, ventana: P.ventana, referencia: N.isoDe(S.ref) },
      presupuesto: +$('#presupuesto').value || null, total: t.total,
      lineas: ls.map(r => ({ codigo: r.codigos[0].slice(2), codigos: r.codigos, desc: r.desc, uc: r.ucNombre, fc: r.fc, algoritmo: r.algoritmo, cantidad: ajustado(r), costo: r.costo, subtotal: ajustado(r) * r.costo, stock: r.stock, cobertura: isFinite(r.cobertura) ? r.cobertura : null }))
    };
    const lista = UI.leerLS(PED, []) || [];
    lista.unshift(p);
    UI.guardarLS(PED, lista.slice(0, 60));

    const g = UI.ghConfig();

      try {
        const ruta = UI.rutaDatos(g, 'pedidos.json');
        const a = await UI.ghArchivo(g, ruta);

        await UI.ghEscribir(g, ruta, { version: 1, actualizado: new Date().toISOString(), pedidos: [p, ...prev.filter(x => x.id !== p.id)].slice(0, 500) }, `Pedido aprobado ${p.un} ${p.fecha.slice(0, 10)}`);
        enviado = true; p.enviado = true; UI.guardarLS(PED, [p, ...lista.slice(1)].slice(0, 60));
      } catch (e) { UI.aviso('El pedido quedó guardado en este equipo', 'No se pudo enviar al repositorio: ' + e.message, 'error'); }
    }
    UI.aviso(`Pedido de ${m.un} aprobado`, `${ls.length} productos · ${N.fmtUSD(t.total, 2)}${enviado ? ' · enviado al repositorio' : ''}`, 'ok', { accion: { texto: 'Descargar Excel', fn: () => exportar(p) }, duracion: 9000 });
    B.ajustes = {}; B.notas = ''; B.guardado = null;
    localStorage.removeItem(kB(m.un));

  }

  /* ---------- Marca completa ---------- */

  }

  function eventos() {
    UI.segmento($('#s-lista'), E.lista, v => { E.lista = v; pintarLista(); });
    UI.segmento($('#s-tend'), E.tend, v => { E.tend = v; pintarTendencia(); });

    $('#buscar-prod').addEventListener('input', e => { E.buscarProd = e.target.value; pintarTabla(); });
    $('#f-submarca').addEventListener('change', e => { E.submarca = e.target.value; pintarTabla(); });
    $('#f-inactivos').addEventListener('change', e => { E.inactivos = e.target.checked; pintarTabla(); });
    $('#restablecer').addEventListener('click', () => { B.ajustes = {}; pintarTabla(); pintarAlertas(); autoguardar(); UI.aviso('Cantidades restablecidas', 'Todas vuelven al sugerido del algoritmo.', 'info'); });
    $$('#tabla th.ord').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; E.orden = { k, dir: E.orden.k === k ? -E.orden.dir : (k === 'desc' || k === 'cod' || k === 'cobertura' ? 1 : -1) }; pintarTabla(); }));
    const filaDe = el => { const tr = el.closest('tr[data-id]'); if (!tr) return null; return { tr, r: marcaActual().filas.find(x => x.id === tr.dataset.id) }; };
    $('#cuerpo').addEventListener('input', e => { if (!e.target.classList.contains('aj')) return; const x = filaDe(e.target); if (!x) return; fijar(x.r, e.target.value); actualizarFila(x.tr, x.r); });
    $('#cuerpo').addEventListener('change', e => { if (!e.target.classList.contains('aj')) return; const x = filaDe(e.target); if (!x) return; e.target.value = ajustado(x.r); });
    $('#cuerpo').addEventListener('click', e => {
      const b = e.target.closest('.rap button'); if (!b) return;
      const x = filaDe(b); if (!x) return;
      const a = ajustado(x.r);
      if (b.dataset.a === 'mas') fijar(x.r, Math.max(a + 1, Math.ceil((a || x.r.algoritmo || 1) * 1.1)));
      if (b.dataset.a === 'menos') fijar(x.r, a > 0 ? Math.min(a - 1, Math.floor(a * 0.9)) : 0);
      if (b.dataset.a === 'min') fijar(x.r, x.r.minimo);
      actualizarFila(x.tr, x.r);
    });
    $('#presupuesto').addEventListener('input', e => { B.presupuesto = e.target.value === '' ? null : +e.target.value; pintarPresupuesto(); pintarAlertas(); autoguardar(); });
    $('#notas').addEventListener('input', e => { B.notas = e.target.value; autoguardar(); });
    const param = (id, k) => $(id).addEventListener('change', e => {
      const v = e.target.value === '' ? null : Math.max(0, +e.target.value);
      B[k] = v; guardarBorrador(true); recalcular(); pintarLista(); pintarMarca();
      UI.aviso('Sugerido recalculado', `${E.marca}: cobertura ${$('#p-cob').value} días + ${$('#p-seg').value} de seguridad.`, 'info');
    });
    param('#p-cob', 'cobertura'); param('#p-seg', 'seguridad');

    $('#aprobar').addEventListener('click', aprobar);
  }

  async function iniciar() {
    let d;

    if (!d.ventas || !d.ventas.h) {
      $('#app').innerHTML = `<div class="tarj vacio" style="max-width:560px;margin:40px auto"><h2 style="margin:0 0 6px;color:var(--tinta)">Todavía no hay datos publicados</h2><p>El sugerido necesita ventas e inventario. Cárgalos en el panel administrativo y publícalos.</p><p><a class="btn prim" href="admin.html">Ir al panel administrativo</a></p></div>`;
      return;
    }
    local = d.local;
    M = N.construirModelo(d.ventas, d.inventario, d.config);
    M.Cbase = JSON.parse(JSON.stringify(M.C.marcas || {}));
    recalcular();
    $('#sub').textContent = 'Sugerido por marca · ' + UI.etiquetaDatos(M, local);
    $('#app').className = 'sug';
    $('#app').innerHTML = '';
    $('#app').appendChild($('#t-sug').content.cloneNode(true));
    if (local) $('#aviso-local').innerHTML = '<div class="franja">Vista previa guardada en este navegador desde el panel administrativo. Publícala para que todos la vean.</div>';
    if (!d.inventario) $('#aviso-local').innerHTML += '<div class="franja">No hay inventario publicado: el stock se toma como cero y todo producto con venta aparece en quiebre.</div>';
    $('#pie').textContent = `Sugerido = venta promedio por día hábil × (cobertura objetivo + stock de seguridad) − stock actual, redondeado a la unidad de compra. Las descripciones de MobilVendor y Módulo B se suman como un solo producto según el agrupador.`;
    eventos();
    const pedida = new URLSearchParams(location.search).get('marca');
    const inicial = (pedida && S.marcas.find(m => m.un === pedida)) ? pedida : (S.marcas[0] && S.marcas[0].un);
    E.marca = inicial;
    pintarLista();
    if (inicial) elegir(inicial);
  }
  iniciar();
})();
</script>
</body>
</html>
