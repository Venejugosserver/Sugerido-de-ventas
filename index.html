<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analítico de ventas · SUGERIDO DE VENTAS · Venejugos 2015</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="estilos.css">
<style>
  .kpi-mini{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--tinta-3)}
  .leyenda{display:flex;gap:14px;align-items:center;font-size:.78rem;color:var(--tinta-2)}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .matriz td.heat{min-width:74px}
  .matriz td:first-child{position:sticky;left:0;background:var(--sup);z-index:1}
  .matriz th:first-child{left:0;z-index:2}
  .fila-clic{cursor:pointer}
  @media (hover:hover) and (pointer:fine){.fila-clic:hover td{background:var(--azul-suave)}}
  .rango-pers{display:flex;gap:6px;align-items:center}
  .barra-pct{display:block;height:4px;border-radius:2px;background:var(--azul-2);opacity:.75;margin-top:3px}
</style>
<script src="chart.umd.min.js"></script>
<script src="nucleo.js"></script>
<script src="ui.js"></script>
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <img class="logo" src="logo.jpg" alt="Venejugos">
    <div class="titulo"><h1>SUGERIDO DE VENTAS</h1><p id="sub">Analítico de ventas · Venejugos 2015</p></div>
    <nav class="nav seg" aria-label="Secciones">
      <a class="seg-op" href="index.html" aria-current="page">Analítico</a>
      <a class="seg-op" href="sugerido.html">Sugerido</a>
      <a class="seg-op" href="admin.html">Panel administrativo</a>
    </nav>
  </div>
</header>

<div class="herr" id="herr" hidden>
  <div class="herr-in">
    <div class="grupo-ctl"><span class="et">Período</span>
      <div class="seg" role="radiogroup" aria-label="Período" id="s-rango">
        <button class="seg-op" role="radio" data-v="30">30 días</button>
        <button class="seg-op" role="radio" data-v="mes">Mes</button>
        <button class="seg-op" role="radio" data-v="tri">Trimestre</button>
        <button class="seg-op" role="radio" data-v="anio">Año</button>
        <button class="seg-op" role="radio" data-v="pers">Otro</button>
      </div>
      <span class="rango-pers" id="pers" hidden>
        <input type="date" class="campo" id="desde" aria-label="Desde">
        <input type="date" class="campo" id="hasta" aria-label="Hasta">
      </span>
    </div>
    <div class="grupo-ctl"><span class="et">Agrupar por</span>
      <div class="seg" role="radiogroup" aria-label="Agrupar por" id="s-gran">
        <button class="seg-op" role="radio" data-v="d">Día</button>
        <button class="seg-op" role="radio" data-v="s">Semana</button>
        <button class="seg-op" role="radio" data-v="m">Mes</button>
        <button class="seg-op" role="radio" data-v="t">Trimestre</button>
      </div>
    </div>
    <div class="grupo-ctl"><span class="et">Módulo</span>
      <div class="seg" role="radiogroup" aria-label="Módulo" id="s-mod">
        <button class="seg-op" role="radio" data-v="todos">Ambos</button>
        <button class="seg-op" role="radio" data-v="M">MobilVendor</button>
        <button class="seg-op" role="radio" data-v="B">Módulo B</button>
      </div>
    </div>
    <div class="grupo-ctl"><span class="et">Línea</span>
      <div class="seg" role="radiogroup" aria-label="Línea" id="s-linea">
        <button class="seg-op" role="radio" data-v="todas">Todas</button>
        <button class="seg-op" role="radio" data-v="base">Sin cigarros</button>
        <button class="seg-op" role="radio" data-v="cig">Cigarros</button>
      </div>
    </div>
    <div class="grupo-ctl">
      <label class="sr" for="marca">Marca</label>
      <select class="campo" id="marca"><option value="">Todas las marcas</option></select>
    </div>
    <div class="der">
      <div class="seg" role="radiogroup" aria-label="Medida" id="s-med">
        <button class="seg-op" role="radio" data-v="v">Venta $</button>
        <button class="seg-op" role="radio" data-v="q">Unidades</button>
      </div>
    </div>
  </div>
</div>

<main id="app">
  <div class="cargando" id="cargando"><div>Cargando ventas…</div><div class="barra-prog"><i style="width:35%"></i></div></div>
</main>
<p class="pie" id="pie"></p>

<template id="t-contenido">
  <div id="aviso-local"></div>
  <section class="talon" aria-label="Resumen del período">
    <div class="talon-fecha"><div><div class="peq" id="t-gran"></div><div class="grande" id="t-rango"></div></div><div class="peq" id="t-comp"></div></div>
    <div class="talon-filas" id="t-filas"></div>
  </section>
  <div class="rejilla">
    <section class="tarj">
      <header><div><h2 id="g1-tit">Venta por período</h2><p class="sub" id="g1-sub"></p></div>
        <div class="leyenda"><span><i style="background:var(--azul-2)"></i>MobilVendor</span><span><i style="background:var(--azul-3)"></i>Módulo B</span></div></header>
      <div class="lienzo alto"><canvas id="g-serie" role="img" aria-label="Venta por período"></canvas></div>
    </section>
    <div class="rejilla r2">
      <section class="tarj"><header><div><h2 id="g2-tit">Participación por marca</h2><p class="sub" id="g2-sub"></p></div></header><div class="lienzo alto"><canvas id="g-marcas" role="img" aria-label="Participación"></canvas></div></section>
      <section class="tarj"><header><div><h2>Productos con más venta</h2><p class="sub">Descripciones agrupadas entre MobilVendor y Módulo B</p></div></header><div class="lienzo alto"><canvas id="g-prod" role="img" aria-label="Productos con más venta"></canvas></div></section>
    </div>
    <section class="tarj">
      <header><div><h2 id="mx-tit">Matriz por período</h2><p class="sub" id="mx-sub"></p></div></header>
      <div class="tabla-env"><table class="t matriz" id="matriz"></table></div>
    </section>
    <div class="rejilla r2">
      <section class="tarj"><header><div><h2>Presentaciones</h2><p class="sub">Cada presentación con su propio precio promedio</p></div></header><div class="tabla-env"><table class="t" id="pres"></table></div></section>
      <section class="tarj"><header><div><h2>Venta promedio por día de la semana</h2><p class="sub">Promedio por día con facturación</p></div></header><div class="lienzo"><canvas id="g-dow" role="img" aria-label="Venta por día de la semana"></canvas></div></section>
    </div>
    <div class="rejilla r2">
      <section class="tarj"><header><div><h2>Clientes con mayor compra</h2><p class="sub" id="cli-sub"></p></div></header><div class="tabla-env"><table class="t" id="clientes"></table></div></section>
      <section class="tarj"><header><div><h2>Venta por asesor</h2><p class="sub">Clientes atendidos con compra neta positiva</p></div></header><div class="tabla-env"><table class="t" id="asesores"></table></div></section>
    </div>
  </div>
</template>

<script>
(() => {
  'use strict';
  const N = NUC, { $, $$ } = UI;
  const LS = 'vjs_analitico';
  let M = null, local = false;
  const E = Object.assign({ rango: 'anio', gran: 'm', modulo: 'todos', linea: 'todas', marca: '', medida: 'v', desde: null, hasta: null }, UI.leerLS(LS, {}));

  function rango() {
    const fin = M.diaMax;
    const f = N.fechaDe(fin), y = f.getUTCFullYear(), m = f.getUTCMonth();
    const d0 = (a, b, c) => Math.floor(Date.UTC(a, b, c) / 864e5);
    let desde, hasta = fin, anterior;
    if (E.rango === '30') { desde = fin - 29; }
    else if (E.rango === 'mes') { desde = d0(y, m, 1); anterior = { desde: d0(y, m - 1, 1), hasta: Math.min(d0(y, m - 1, 1) + (fin - desde), d0(y, m, 0)) }; }
    else if (E.rango === 'tri') { const q = Math.floor(m / 3) * 3; desde = d0(y, q, 1); anterior = { desde: d0(y, q - 3, 1), hasta: Math.min(d0(y, q - 3, 1) + (fin - desde), d0(y, q, 0)) }; }
    else if (E.rango === 'anio') { desde = Math.max(d0(y, 0, 1), M.diaMin); }
    else { desde = E.desde != null ? E.desde : fin - 29; hasta = E.hasta != null ? E.hasta : fin; if (hasta < desde) [desde, hasta] = [hasta, desde]; }
    if (!anterior) { const n = hasta - desde + 1; anterior = { desde: desde - n, hasta: desde - 1 }; }
    return { desde, hasta, anterior };
  }
  const filtro = r => ({ desde: r.desde, hasta: r.hasta, modulo: E.modulo, linea: E.linea, marcas: E.marca ? [E.marca] : [] });
  const guardar = () => UI.guardarLS(LS, E);

  function rangoTexto(a, b) {
    const fa = N.fechaDe(a), fb = N.fechaDe(b);
    const mismoA = fa.getUTCFullYear() === fb.getUTCFullYear();
    if (a === b) return N.fmtFecha(a);
    if (mismoA && fa.getUTCMonth() === fb.getUTCMonth()) return `${fa.getUTCDate()}–${fb.getUTCDate()} ${N.MESES[fb.getUTCMonth()]} ${fb.getUTCFullYear()}`;
    return `${fa.getUTCDate()} ${N.MESES[fa.getUTCMonth()]}${mismoA ? '' : ' ' + fa.getUTCFullYear()} – ${fb.getUTCDate()} ${N.MESES[fb.getUTCMonth()]} ${fb.getUTCFullYear()}`;
  }
  function variacion(act, ant, invertir) {
    if (ant == null || !isFinite(ant) || Math.abs(ant) < 1e-9) return '<div class="c">Sin datos del período anterior</div>';
    const v = act / ant - 1;
    const bueno = invertir ? v < 0 : v > 0;
    return `<div class="c ${Math.abs(v) < 0.005 ? '' : bueno ? 'sube' : 'baja'}">${v > 0 ? '▲' : v < 0 ? '▼' : '='} ${N.fmtPct(v)} vs anterior</div>`;
  }

  function pintarTalon(r) {
    const f = filtro(r), fa = filtro(r.anterior);
    const a = N.resumen(M, f);
    const conAnt = r.anterior.hasta >= M.diaMin;
    const b = conAnt ? N.resumen(M, fa) : null;
    $('#t-gran').textContent = `${a.dias} días con facturación`;
    $('#t-rango').textContent = rangoTexto(r.desde, r.hasta);
    $('#t-comp').textContent = conAnt ? `Comparado con ${rangoTexto(r.anterior.desde, Math.min(r.anterior.hasta, M.diaMax))}` : 'El histórico no cubre el período anterior';
    const g = (k) => b ? b[k] : null;
    const filas = [
      ['Venta neta', N.fmtUSD(a.neta, 0), variacion(a.neta, g('neta'))],
      ['Devoluciones', N.fmtUSD(a.dv, 0), `<div class="c">${N.fmtN(a.pDev * 100, 1)} % de la venta bruta</div>`],
      ['Unidades vendidas', N.fmtN(a.q), variacion(a.q, g('q'))],
      ['Clientes atendidos', N.fmtN(a.clientes), variacion(a.clientes, g('clientes'))],
      ['Compra por cliente', N.fmtUSD(a.ticket, 0), variacion(a.ticket, g('ticket'))],
      ['Productos vendidos', N.fmtN(a.skus), variacion(a.skus, g('skus'))],
      ['Venta por día hábil', N.fmtUSD(a.promDia, 0), variacion(a.promDia, g('promDia'))]
    ];
    $('#t-filas').innerHTML = filas.map(([et, v, c]) => `<div class="renglon"><div class="et">${et}</div><div class="v">${v}</div>${c}</div>`).join('');
  }

  function fmtMed(v) { return E.medida === 'q' ? N.fmtN(v) : N.fmtCorto(v); }

  function pintarSerie(r) {
    const s = N.serie(M, filtro(r), E.gran);
    const c = UI.colores();
    const q = E.medida === 'q';
    $('#g1-tit').textContent = q ? 'Unidades por período' : 'Venta neta por período';
    const totalB = (q ? s.qb : s.b).reduce((x, y) => x + y, 0), totalM = (q ? s.qm : s.mv).reduce((x, y) => x + y, 0);
    $('#g1-sub').textContent = `${N.GRAN[E.gran]} · MobilVendor ${q ? N.fmtN(totalM) : N.fmtCorto(totalM)} · Módulo B ${q ? N.fmtN(totalB) : N.fmtCorto(totalB)}`;
    UI.grafico('g-serie', {
      type: 'bar',
      data: { labels: s.etiquetas, datasets: [
        { label: 'MobilVendor', data: q ? s.qm : s.mv, backgroundColor: c.azul, borderRadius: 3, stack: 'v' },
        { label: 'Módulo B', data: q ? s.qb : s.b, backgroundColor: c.azul3, borderRadius: 3, stack: 'v' }
      ] },
      options: {
        maintainAspectRatio: false, animation: UI.reducido() ? false : { duration: 300 },
        interaction: { mode: 'index', intersect: false },
        scales: { x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 10 } }, y: { stacked: true, ticks: { callback: v => q ? N.fmtN(v) : N.fmtCorto(v) } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: it => s.largas[it[0].dataIndex] + ` · ${s.dias[it[0].dataIndex]} días hábiles`,
          label: it => ` ${it.dataset.label}: ${q ? N.fmtN(it.raw) : N.fmtUSD(it.raw, 0)}`,
          footer: it => { const k = it[0].dataIndex; return `Total: ${q ? N.fmtN(s.q[k]) : N.fmtUSD(s.total[k], 0)}`; }
        } } }
      }
    });
  }

  function barrasH(id, etiquetas, valores, color, formato) {
    UI.grafico(id, {
      type: 'bar',
      data: { labels: etiquetas, datasets: [{ data: valores, backgroundColor: color, borderRadius: 3, barPercentage: .78 }] },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, animation: UI.reducido() ? false : { duration: 300 },
        scales: { x: { ticks: { callback: v => formato(v), maxTicksLimit: 5 } }, y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 11 }, callback: function (v) { const t = this.getLabelForValue(v); return t.length > 34 ? t.slice(0, 33) + '…' : t; } } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: it => ' ' + (E.medida === 'q' ? N.fmtN(it.raw) + ' unidades' : N.fmtUSD(it.raw, 0)) } } }
      }
    });
  }

  function pintarParticipacion(r) {
    const f = filtro(r), c = UI.colores();
    const med = E.medida;
    let filas, titulo, sub;
    if (E.marca) {
      const porG = N.porDimension(M, f, 'grupo', med);
      const acc = new Map();
      for (const x of porG) { const k = M.grupos[x.k].ma || 'SIN SUBMARCA'; const a = acc.get(k) || { k, v: 0, q: 0 }; a.v += x.v; a.q += x.q; acc.set(k, a); }
      filas = [...acc.values()].sort((a, b) => med === 'q' ? b.q - a.q : b.v - a.v).map(x => ({ et: x.k, val: med === 'q' ? x.q : x.v }));
      titulo = `Submarcas de ${E.marca}`; sub = 'Según la clasificación del histórico';
    } else {
      filas = N.porDimension(M, f, 'marca', med).map(x => ({ et: M.marcas[x.k], val: med === 'q' ? x.q : x.v }));
      titulo = 'Participación por marca'; sub = 'Unidad de negocio con el nombre del Módulo B';
    }
    const tot = filas.reduce((a, x) => a + Math.max(0, x.val), 0);
    const top = filas.slice(0, 12);
    $('#g2-tit').textContent = titulo;
    $('#g2-sub').textContent = `${sub} · ${filas.length} en total`;
    barrasH('g-marcas', top.map(x => `${x.et} · ${N.fmtN(tot ? x.val / tot * 100 : 0, 1)} %`), top.map(x => x.val), c.azul, fmtMed);
  }

  function pintarProductos(r) {
    const f = filtro(r), c = UI.colores();
    const filas = N.porDimension(M, f, 'grupo', E.medida).slice(0, 15);
    barrasH('g-prod', filas.map(x => M.grupos[x.k].desc), filas.map(x => E.medida === 'q' ? x.q : x.v), c.azul3, fmtMed);
  }

  function pintarMatriz(r) {
    const porMarca = !E.marca;
    const mx = N.matriz(M, filtro(r), E.gran, porMarca ? 'marca' : 'grupo', porMarca ? 30 : 40);
    let ini = 0;
    const maxCols = 13;
    if (mx.periodos.length > maxCols) ini = mx.periodos.length - maxCols;
    const cols = mx.etiquetas.slice(ini);
    const q = E.medida === 'q';
    $('#mx-tit').textContent = porMarca ? 'Marcas por período' : `Productos de ${E.marca} por período`;
    $('#mx-sub').textContent = (ini ? `Últimos ${maxCols} períodos de ${mx.periodos.length} · ` : '') + (porMarca ? 'Toca una marca para ver sus productos' : 'Descripciones agrupadas') + ` · ${q ? 'unidades' : 'venta neta $'}`;
    const filas = mx.filas.map(fl => {
      const vals = [...(q ? fl.q : fl.v)].slice(ini);
      const max = Math.max(...vals, 0);
      const dz = mx.dias.slice(ini);
      const ult = vals[vals.length - 1] / Math.max(1, dz[dz.length - 1]), pen = vals[vals.length - 2] / Math.max(1, dz[dz.length - 2]);
      const varx = vals.length > 1 && pen > 0 && dz[dz.length - 1] > 0 ? ult / pen - 1 : null;
      const nombre = porMarca ? M.marcas[fl.k] : M.grupos[fl.k].desc;
      const celdas = vals.map(v => {
        const a = max > 0 ? Math.max(0, v) / max : 0;
        return `<td class="n heat" style="background:color-mix(in srgb, var(--azul-2) ${Math.round(a * 38)}%, transparent)">${q ? N.fmtN(v) : N.fmtCorto(v)}</td>`;
      }).join('');
      const tot = q ? fl.totQ : fl.tot;
      return `<tr class="${porMarca ? 'fila-clic' : ''}" ${porMarca ? `data-marca="${N.esc(nombre)}" tabindex="0"` : ''}><td class="desc"><b>${N.esc(nombre)}</b>${porMarca ? '' : `<div class="cod">${N.esc(M.grupos[fl.k].ma || '')}</div>`}</td>${celdas}<td class="n"><b>${q ? N.fmtN(tot) : N.fmtCorto(tot)}</b></td><td class="n ${varx == null ? '' : varx >= 0 ? 'sube' : 'baja'}">${varx == null ? '—' : N.fmtPct(varx, 0)}</td></tr>`;
    }).join('');
    $('#matriz').innerHTML = `<thead><tr><th>${porMarca ? 'Marca' : 'Producto'}</th>${cols.map(c => `<th class="n">${c}</th>`).join('')}<th class="n">Total</th><th class="n" title="Venta por día hábil del último período contra el anterior">Ritmo vs anterior</th></tr></thead><tbody>${filas || `<tr><td colspan="${cols.length + 3}" class="vacio">Sin ventas con estos filtros.</td></tr>`}</tbody>`;
    $$('#matriz [data-marca]').forEach(tr => {
      const ir = () => { E.marca = tr.dataset.marca; $('#marca').value = E.marca; guardar(); pintar(); window.scrollTo({ top: 0, behavior: UI.reducido() ? 'auto' : 'smooth' }); };
      tr.addEventListener('click', ir);
      tr.addEventListener('keydown', e => { if (e.key === 'Enter') ir(); });
    });
  }

  function pintarPresentaciones(r) {
    const filas = N.porDimension(M, filtro(r), 'pres', 'v');
    const tot = filas.reduce((a, x) => a + x.v, 0);
    $('#pres').innerHTML = `<thead><tr><th>Presentación</th><th class="n">Venta neta</th><th class="n">Participación</th><th class="n">Cantidad vendida</th><th class="n">Precio promedio</th></tr></thead><tbody>${filas.map(x => {
      const cu = M.unidades[x.k];
      const pct = tot ? x.v / tot : 0;
      return `<tr><td><b>${N.esc(M.nombreU(cu))}</b> <span class="cod">${N.esc(cu)}</span></td><td class="n">${N.fmtUSD(x.v, 0)}</td><td class="n">${N.fmtN(pct * 100, 1)} %<span class="barra-pct" style="width:${Math.round(pct * 100)}%"></span></td><td class="n">${N.fmtN(x.qp)}</td><td class="n">${x.qp > 0 ? N.fmtUSD(x.vb / Math.max(x.qp, 1e-9), 2) : '—'}</td></tr>`;
    }).join('') || '<tr><td colspan="5" class="vacio">Sin ventas con estos filtros.</td></tr>'}</tbody>`;
  }

  function pintarDow(r) {
    const f = filtro(r), c = UI.colores();
    const filas = N.porDimension(M, f, 'dow', E.medida);
    const dias = [0, 0, 0, 0, 0, 0, 0];
    for (const d of M.diasVenta) if (d >= f.desde && d <= f.hasta) dias[N.dowDe(d)]++;
    const vals = [0, 1, 2, 3, 4, 5].map(k => { const x = filas.find(z => z.k === k); const n = dias[k]; return x && n ? (E.medida === 'q' ? x.q : x.v) / n : 0; });
    UI.grafico('g-dow', {
      type: 'bar',
      data: { labels: N.DIAS_S.slice(0, 6), datasets: [{ data: vals, backgroundColor: c.azul, borderRadius: 4, barPercentage: .62 }] },
      options: { maintainAspectRatio: false, animation: UI.reducido() ? false : { duration: 300 }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: v => fmtMed(v), maxTicksLimit: 5 } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: it => ` ${E.medida === 'q' ? N.fmtN(it.raw) + ' unidades' : N.fmtUSD(it.raw, 0)} por día · ${dias[it.dataIndex]} días` } } } }
    });
  }

  function pintarClientes(r) {
    const f = filtro(r);
    const top = N.clientesTop(M, f, 15);
    $('#cli-sub').textContent = E.marca ? `Compras de ${E.marca}` : 'Todas las marcas del filtro';
    $('#clientes').innerHTML = `<thead><tr><th>Cliente</th><th>Asesor</th><th class="n">Días con compra</th><th class="n">Compra neta</th></tr></thead><tbody>${top.map(x => `<tr><td class="desc"><b>${N.esc(x.nombre || x.rif)}</b><div class="cod">${N.esc(x.rif)}</div></td><td class="cod">${N.esc(x.asesor)}</td><td class="n">${x.visitas}</td><td class="n">${N.fmtUSD(x.v, 0)}</td></tr>`).join('') || '<tr><td colspan="4" class="vacio">Sin clientes con estos filtros.</td></tr>'}</tbody>`;
    const as = N.asesores(M, f).slice(0, 20);
    const tot = as.reduce((a, x) => a + Math.max(0, x.v), 0);
    $('#asesores').innerHTML = `<thead><tr><th>Asesor</th><th class="n">Clientes</th><th class="n">Venta neta</th><th class="n">Participación</th></tr></thead><tbody>${as.map(x => `<tr><td><b>${N.esc(x.nombre)}</b></td><td class="n">${N.fmtN(x.clientes)}</td><td class="n">${N.fmtUSD(x.v, 0)}</td><td class="n">${N.fmtN(tot ? x.v / tot * 100 : 0, 1)} %</td></tr>`).join('') || '<tr><td colspan="4" class="vacio">Sin datos.</td></tr>'}</tbody>`;
  }

  function pintar() {
    const r = rango();
    if (E.rango === 'pers') { $('#desde').value = N.isoDe(r.desde); $('#hasta').value = N.isoDe(r.hasta); }
    pintarTalon(r); pintarSerie(r); pintarParticipacion(r); pintarProductos(r); pintarMatriz(r); pintarPresentaciones(r); pintarDow(r); pintarClientes(r);
  }

  function controles() {
    $('#herr').hidden = false;
    const sel = $('#marca');
    sel.innerHTML = '<option value="">Todas las marcas</option>' + M.marcas.filter(m => !M.grupos.every(g => g.un !== m) || true).map(m => `<option>${N.esc(m)}</option>`).join('');
    if (E.marca && !M.marcas.includes(E.marca)) E.marca = '';
    sel.value = E.marca;
    sel.addEventListener('change', () => { E.marca = sel.value; guardar(); pintar(); });
    UI.segmento($('#s-rango'), E.rango, v => { E.rango = v; $('#pers').hidden = v !== 'pers'; if (v === 'pers' && E.desde == null) { E.desde = M.diaMax - 29; E.hasta = M.diaMax; } if (v === '30' && E.gran === 'm') { E.gran = 'd'; granSeg.marcar('d'); } guardar(); pintar(); });
    $('#pers').hidden = E.rango !== 'pers';
    const granSeg = UI.segmento($('#s-gran'), E.gran, v => { E.gran = v; guardar(); pintar(); });
    UI.segmento($('#s-mod'), E.modulo, v => { E.modulo = v; guardar(); pintar(); });
    UI.segmento($('#s-linea'), E.linea, v => { E.linea = v; guardar(); pintar(); });
    UI.segmento($('#s-med'), E.medida, v => { E.medida = v; guardar(); pintar(); });
    for (const id of ['desde', 'hasta']) {
      const inp = $('#' + id);
      inp.min = N.isoDe(M.diaMin); inp.max = N.isoDe(M.diaMax);
      inp.addEventListener('change', () => { const d = N.diaDeIso(inp.value); if (!isNaN(d)) { E[id] = d; guardar(); pintar(); } });
    }
  }

  async function iniciar() {
    let d;
    try { d = await N.cargarDatos(); } catch (e) { d = {}; }
    if (!d.ventas || !d.ventas.h) {
      $('#app').innerHTML = `<div class="tarj vacio" style="max-width:560px;margin:40px auto"><h2 style="margin:0 0 6px;color:var(--tinta)">Todavía no hay ventas publicadas</h2><p>Carga el histórico y las ventas del día en el panel administrativo y publícalas para ver el analítico.</p><p><a class="btn prim" href="admin.html">Ir al panel administrativo</a></p></div>`;
      return;
    }
    local = d.local;
    M = N.construirModelo(d.ventas, d.inventario, d.config);
    $('#sub').textContent = 'Analítico · ' + UI.etiquetaDatos(M, local);
    $('#app').innerHTML = '';
    $('#app').appendChild($('#t-contenido').content.cloneNode(true));
    if (local) $('#aviso-local').innerHTML = '<div class="franja">Estás viendo la vista previa guardada en este navegador desde el panel administrativo. Publícala para que todos la vean.</div>';
    const capas = M.capas || {};
    const partes = [];
    if (capas.historico) partes.push(`Histórico: ${N.fmtFecha(capas.historico.desde)} al ${N.fmtFecha(capas.historico.hasta)} (${capas.historico.archivo || 'archivo'})`);
    if (capas.M && capas.M.dias && capas.M.dias.length) partes.push(`MobilVendor diario: ${N.fmtFecha(capas.M.dias[0])} al ${N.fmtFecha(capas.M.dias[capas.M.dias.length - 1])}`);
    if (capas.B && capas.B.dias && capas.B.dias.length) partes.push(`Módulo B diario: ${N.fmtFecha(capas.B.dias[0])} al ${N.fmtFecha(capas.B.dias[capas.B.dias.length - 1])}`);
    $('#pie').textContent = partes.join(' · ') + ' · Venta neta sin IVA en dólares; las devoluciones y notas de crédito restan.';
    controles();
    pintar();
    let t;
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { clearTimeout(t); t = setTimeout(pintar, 50); });
  }
  iniciar();
})();
</script>
</body>
</html>
