<header class="barra">
  <div class="barra-in">
    <img class="logo" src="logo.jpg" alt="Venejugos">
    <div class="titulo"><h1>SUGERIDO DE VENTAS</h1><p id="sub">Analítico de ventas · Venejugos 2015</p></div>
    <nav class="nav seg" aria-label="Secciones">
      <a class="seg-op" href="index.html" aria-current="page">Analítico</a>
      <a class="seg-op" href="sugerido.html">Sugerido</a>
      <a class="seg-op" href="admin.html">Panel administrativo</a>
    </nav>
  </div>
</header>

<div class="herr" id="herr" hidden>
  <div class="herr-in">
    <div class="grupo-ctl"><span class="et">Período</span>
      <div class="seg" role="radiogroup" aria-label="Período" id="s-rango">
        <button class="seg-op" role="radio" data-v="30">30 días</button>
        <button class="seg-op" role="radio" data-v="mes">Mes</button>
        <button class="seg-op" role="radio" data-v="tri">Trimestre</button>
        <button class="seg-op" role="radio" data-v="anio">Año</button>
        <button class="seg-op" role="radio" data-v="pers">Otro</button>
      </div>
      <span class="rango-pers" id="pers" hidden>
        <input type="date" class="campo" id="desde" aria-label="Desde">
        <input type="date" class="campo" id="hasta" aria-label="Hasta">
      </span>
    </div>
    <div class="grupo-ctl"><span class="et">Agrupar por</span>
      <div class="seg" role="radiogroup" aria-label="Agrupar por" id="s-gran">
        <button class="seg-op" role="radio" data-v="d">Día</button>
        <button class="seg-op" role="radio" data-v="s">Semana</button>
        <button class="seg-op" role="radio" data-v="m">Mes</button>
        <button class="seg-op" role="radio" data-v="t">Trimestre</button>
      </div>
    </div>
    <div class="grupo-ctl"><span class="et">Módulo</span>
      <div class="seg" role="radiogroup" aria-label="Módulo" id="s-mod">
        <button class="seg-op" role="radio" data-v="todos">Ambos</button>
        <button class="seg-op" role="radio" data-v="M">MobilVendor</button>
        <button class="seg-op" role="radio" data-v="B">Módulo B</button>
      </div>
    </div>
    <div class="grupo-ctl"><span class="et">Línea</span>
      <div class="seg" role="radiogroup" aria-label="Línea" id="s-linea">
        <button class="seg-op" role="radio" data-v="todas">Todas</button>
        <button class="seg-op" role="radio" data-v="base">Sin cigarros</button>
        <button class="seg-op" role="radio" data-v="cig">Cigarros</button>
      </div>
    </div>
    <div class="grupo-ctl">
      <label class="sr" for="marca">Marca</label>
      <select class="campo" id="marca"><option value="">Todas las marcas</option></select>
    </div>
    <div class="der">
      <div class="seg" role="radiogroup" aria-label="Medida" id="s-med">
        <button class="seg-op" role="radio" data-v="v">Venta $</button>
        <button class="seg-op" role="radio" data-v="q">Unidades</button>
      </div>
    </div>
  </div>
</div>

<main id="app">
  <div class="cargando" id="cargando"><div>Cargando ventas…</div><div class="barra-prog"><i style="width:35%"></i></div></div>
</main>

  <div class="rejilla">
    <section class="tarj">
      <header><div><h2 id="g1-tit">Venta por período</h2><p class="sub" id="g1-sub"></p></div>
        <div class="leyenda"><span><i style="background:var(--azul-2)"></i>MobilVendor</span><span><i style="background:var(--azul-3)"></i>Módulo B</span></div></header>
      <div class="lienzo alto"><canvas id="g-serie" role="img" aria-label="Venta por período"></canvas></div>
    </section>
    <div class="rejilla r2">
      <section class="tarj"><header><div><h2 id="g2-tit">Participación por marca</h2><p class="sub" id="g2-sub"></p></div></header><div class="lienzo alto"><canvas id="g-marcas" role="img" aria-label="Participación"></canvas></div></section>

    <section class="tarj">

    </div>
    <div class="rejilla r2">

  </div>
